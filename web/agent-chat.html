<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio · AI 智能体控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2310B981'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%230F172A'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0F172A; --bg2:#1E293B; --panel:#1E293B; --panel2:#334155; --border:#334155;
  --text:#F1F5F9; --muted:#94A3B8; --dim:#64748B;
  --accent:#10B981; --accent2:#059669; --amber:#F59E0B; --red:#EF4444; --blue:#3B82F6; --purple:#8B5CF6;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button,textarea,input{font-family:var(--sans)}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  display:flex;flex-direction:column;overflow:hidden;
}
::selection{background:rgba(16,185,129,.3)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* ===== 顶栏 ===== */
header{
  flex:0 0 auto;height:56px;border-bottom:1px solid var(--border);background:var(--bg2);
  padding:0 20px;display:flex;align-items:center;gap:16px;z-index:10;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--dim);margin-top:1px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.stat-chip{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  padding:6px 12px;background:var(--panel);border-radius:8px;border:1px solid var(--border);
}
.stat-chip b{color:var(--text);font-weight:600;font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--accent);box-shadow:0 0 10px rgba(16,185,129,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== 主布局 ===== */
.main{flex:1 1 auto;display:flex;overflow:hidden}

/* ===== 左侧边栏 ===== */
aside{
  flex:0 0 280px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;transition:margin-left .3s;
}
aside.collapsed{margin-left:-280px}
.sidebar-section{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-section h3{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;
  color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.sidebar-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--muted);margin-bottom:2px;cursor:default;
}
.sidebar-item:hover{background:var(--panel)}
.sidebar-item .icon{width:20px;text-align:center;flex:0 0 auto}
.sidebar-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .value{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tag{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;
  background:var(--panel2);color:var(--muted);margin:2px;
}
.fact-list{font-size:12px;color:var(--muted);line-height:1.6}
.fact-list li{margin-bottom:4px;list-style:none;padding-left:12px;position:relative}
.fact-list li::before{content:'•';position:absolute;left:0;color:var(--accent)}

/* ===== 聊天区 ===== */
.chat-area{flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden}
.chat-scroll{flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:860px;margin:0 auto;padding:24px 20px 100px}

/* 空状态 */
.empty-state{
  text-align:center;padding:80px 20px;color:var(--dim);
}
.empty-state .big-icon{font-size:64px;margin-bottom:20px;opacity:.3}
.empty-state h2{font-size:22px;color:var(--muted);margin-bottom:8px;font-weight:600}
.empty-state p{font-size:14px;line-height:1.6}
.suggestions{display:flex;gap:10px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.suggestion-chip{
  padding:10px 16px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer;
  transition:all .2s;
}
.suggestion-chip:hover{border-color:var(--accent);color:var(--text);background:var(--panel2)}

/* 消息 */
.msg{display:flex;gap:12px;margin-bottom:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg .avatar{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.msg.user .avatar{background:var(--blue)}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.msg .content{flex:1;min-width:0}
.msg .role{font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:600}
.msg .bubble{
  padding:14px 16px;border-radius:var(--radius);font-size:14px;line-height:1.7;
}
.msg.user .bubble{background:var(--panel2)}
.msg.assistant .bubble{background:var(--panel);border:1px solid var(--border)}
.msg .bubble p{margin-bottom:8px}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble code{
  font-family:var(--mono);font-size:12px;background:var(--bg);
  padding:2px 6px;border-radius:4px;color:var(--accent);
}
.msg .bubble pre{
  background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;
  font-family:var(--mono);font-size:12px;margin:8px 0;line-height:1.5;
}

/* 工具调用卡片 */
.tool-calls{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.tool-card{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  overflow:hidden;font-size:12px;
}
.tool-card-header{
  padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;
  user-select:none;
}
.tool-card-header:hover{background:var(--panel2)}
.tool-icon{width:18px;text-align:center}
.tool-name{font-weight:600;color:var(--text);font-family:var(--mono)}
.tool-status{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px}
.tool-status.ok{background:rgba(16,185,129,.15);color:var(--accent)}
.tool-status.err{background:rgba(239,68,68,.15);color:var(--red)}
.tool-chevron{color:var(--dim);transition:transform .2s}
.tool-card.open .tool-chevron{transform:rotate(90deg)}
.tool-card-body{
  display:none;padding:10px 12px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:11px;color:var(--muted);
  max-height:200px;overflow-y:auto;line-height:1.5;
}
.tool-card.open .tool-card-body{display:block}
.tool-card-body .args{color:var(--blue);margin-bottom:6px}
.tool-card-body .result{color:var(--text);white-space:pre-wrap}

/* ===== 输入区 ===== */
.input-area{
  flex:0 0 auto;padding:16px 20px;border-top:1px solid var(--border);
  background:var(--bg2);
}
.input-inner{max-width:860px;margin:0 auto;position:relative}
.input-box{
  display:flex;align-items:flex-end;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;
  transition:border-color .2s;
}
.input-box:focus-within{border-color:var(--accent)}
.input-box textarea{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-size:14px;line-height:1.5;resize:none;max-height:150px;min-height:24px;
}
.input-box textarea::placeholder{color:var(--dim)}
.send-btn{
  width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;
  background:var(--accent);color:white;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:all .2s;
}
.send-btn:hover{background:var(--accent2)}
.send-btn:disabled{background:var(--panel2);cursor:not-allowed}
.input-hint{
  text-align:center;font-size:11px;color:var(--dim);margin-top:8px;
}

/* ===== 移动端 ===== */
.menu-btn{
  display:none;background:none;border:none;color:var(--text);
  font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;
}
.menu-btn:hover{background:var(--panel2)}
@media (max-width:768px){
  aside{position:fixed;left:0;top:56px;bottom:0;z-index:20;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  aside.collapsed{margin-left:-280px}
  .menu-btn{display:block}
  .stat-chip{display:none}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header>
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="brand">
    <div class="logo">🤖</div>
    <div>
      <h1>Agent Studio</h1>
      <div class="sub">AI 智能体控制台</div>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-chip">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">连接中...</span>
    </div>
    <div class="stat-chip">💎 <b id="statTokens">0</b> tokens</div>
    <div class="stat-chip">💰 ¥<b id="statCost">0.0000</b></div>
    <div class="stat-chip">⚡ <b id="statTools">0</b> 工具</div>
  </div>
</header>

<!-- ===== 主布局 ===== -->
<div class="main">
  <!-- 左侧边栏 -->
  <aside id="sidebar">
    <div class="sidebar-section">
      <h3>📊 运行统计</h3>
      <div class="sidebar-item">
        <span class="icon">🔄</span>
        <span class="label">LLM 调用</span>
        <span class="value" id="statLlmCalls">0</span>
      </div>
      <div class="sidebar-item">
        <span class="icon">🔧</span>
        <span class="label">工具调用</span>
        <span class="value" id="statToolCalls">0</span>
      </div>
      <div class="sidebar-item">
        <span class="icon">⏱️</span>
        <span class="label">平均延迟</span>
        <span class="value" id="statLatency">0ms</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>🛠️ 可用工具</h3>
      <div id="toolList" style="display:flex;flex-wrap:wrap">
        <span class="tag">加载中...</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>📚 知识库</h3>
      <div class="sidebar-item">
        <span class="icon">📄</span>
        <span class="label">文档块</span>
        <span class="value" id="kbChunks">0</span>
      </div>
      <div id="kbSources" style="margin-top:8px;font-size:11px;color:var(--dim)">
        暂无来源
      </div>
    </div>

    <div class="sidebar-section">
      <h3>🧠 长期记忆</h3>
      <div style="font-size:12px;margin-bottom:8px;color:var(--muted)">偏好设置</div>
      <div id="memoryPrefs" style="font-size:12px;color:var(--dim);margin-bottom:12px">
        暂无偏好
      </div>
      <div style="font-size:12px;margin-bottom:6px;color:var(--muted)">记住的事实</div>
      <ul class="fact-list" id="memoryFacts">
        <li>暂无记忆</li>
      </ul>
    </div>
  </aside>

  <!-- 聊天区 -->
  <div class="chat-area">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
          <div class="big-icon">🤖</div>
          <h2>你好，我是你的 AI 智能体</h2>
          <p>我可以调用工具、联网搜索、读写文件、写代码，<br>还能记住你的偏好、查阅知识库。</p>
          <div class="suggestions">
            <div class="suggestion-chip" onclick="sendSuggestion('帮我算一下 (1200-328)*0.7 是多少')">🧮 算个数</div>
            <div class="suggestion-chip" onclick="sendSuggestion('现在几点了？今天星期几？')">🕐 查时间</div>
            <div class="suggestion-chip" onclick="sendSuggestion('帮我搜索一下 AI Agent 的最新进展')">🔍 搜资料</div>
            <div class="suggestion-chip" onclick="sendSuggestion('记住：我喜欢简洁的回答方式')">💾 测试记忆</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-inner">
        <div class="input-box">
          <textarea id="inputBox" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        <div class="input-hint">Agent 会自动思考、调用工具、给出回答 · 支持多轮对话</div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
let sessionId = null;
let isStreaming = false;
let currentToolCalls = [];

// ===== DOM =====
const $ = id => document.getElementById(id);
const chatInner = $('chatInner');
const emptyState = $('emptyState');
const inputBox = $('inputBox');
const sendBtn = $('sendBtn');
const chatScroll = $('chatScroll');

// ===== 初始化 =====
async function init() {
  inputBox.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputBox.addEventListener('input', () => {
    inputBox.style.height = 'auto';
    inputBox.style.height = Math.min(inputBox.scrollHeight, 150) + 'px';
  });

  await Promise.all([
    fetchHealth(),
    fetchStats(),
    fetchKnowledge(),
    fetchMemory(),
    fetchTools(),
  ]);
}

function toggleSidebar() {
  $('sidebar').classList.toggle('collapsed');
}

// ===== API =====
async function fetchHealth() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    $('statusDot').classList.add('on');
    $('statusText').textContent = d.model + ' 已连接';
    $('statTools').textContent = d.tools.length;
  } catch {
    $('statusText').textContent = '连接失败';
  }
}

async function fetchStats() {
  try {
    const r = await fetch('/v1/stats');
    const d = await r.json();
    if (d.error) return;
    $('statTokens').textContent = (d.total_tokens || 0).toLocaleString();
    $('statCost').textContent = (d.cost_yuan || 0).toFixed(4);
    $('statLlmCalls').textContent = d.llm_calls || 0;
    $('statToolCalls').textContent = d.tool_calls || 0;
    $('statLatency').textContent = Math.round(d.avg_llm_latency_ms || 0) + 'ms';
  } catch {}
}

async function fetchKnowledge() {
  try {
    const r = await fetch('/v1/knowledge');
    const d = await r.json();
    $('kbChunks').textContent = d.total_chunks || 0;
    if (d.sources && d.sources.length) {
      $('kbSources').innerHTML = d.sources.map(s =>
        `<div style="margin:2px 0">• ${s.source} (${s.chunks}块)</div>`
      ).join('');
    }
  } catch {}
}

async function fetchMemory() {
  try {
    const r = await fetch('/v1/memory');
    const d = await r.json();
    const prefs = d.preferences || {};
    const prefKeys = Object.keys(prefs);
    if (prefKeys.length) {
      $('memoryPrefs').innerHTML = prefKeys.map(k =>
        `<div>• ${k}：<span style="color:var(--text)">${prefs[k]}</span></div>`
      ).join('');
    }
    const facts = d.facts || [];
    if (facts.length) {
      $('memoryFacts').innerHTML = facts.map(f => `<li>${f.content}</li>`).join('');
    }
  } catch {}
}

async function fetchTools() {
  try {
    const r = await fetch('/v1/tools');
    const d = await r.json();
    const tools = d.tools || [];
    $('toolList').innerHTML = tools.map(t =>
      `<span class="tag" title="${t.function.description}">${t.function.name}</span>`
    ).join('');
  } catch {}
}

// ===== 聊天 =====
function sendSuggestion(text) {
  inputBox.value = text;
  sendMessage();
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isStreaming) return;

  // 隐藏空状态
  if (emptyState) emptyState.style.display = 'none';

  // 添加用户消息
  addMessage('user', text);
  inputBox.value = '';
  inputBox.style.height = 'auto';
  isStreaming = true;
  sendBtn.disabled = true;

  // 添加助手消息占位
  const assistantEl = addMessage('assistant', '');
  const bubble = assistantEl.querySelector('.bubble');
  const toolCallsEl = document.createElement('div');
  toolCallsEl.className = 'tool-calls';
  bubble.after(toolCallsEl);
  currentToolCalls = [];

  // 流式请求
  const url = `/v1/chat/stream?message=${encodeURIComponent(text)}&session_id=${sessionId || ''}`;
  const es = new EventSource(url);

  es.addEventListener('meta', e => {
    const d = JSON.parse(e.data);
    sessionId = d.session_id;
  });

  es.addEventListener('tool', e => {
    const d = JSON.parse(e.data);
    addToolCall(toolCallsEl, d);
  });

  es.addEventListener('delta', e => {
    const d = JSON.parse(e.data);
    bubble.textContent += d.text;
    scrollToBottom();
  });

  es.addEventListener('done', e => {
    const d = JSON.parse(e.data);
    es.close();
    isStreaming = false;
    sendBtn.disabled = false;
    // 刷新统计
    fetchStats();
    fetchMemory();
  });

  es.addEventListener('error', e => {
    es.close();
    isStreaming = false;
    sendBtn.disabled = false;
    if (bubble.textContent === '') {
      bubble.textContent = '⚠️ 连接出错，请重试。';
    }
  });
}

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const avatar = role === 'user' ? '👤' : '🤖';
  const roleName = role === 'user' ? '你' : 'AI 助手';
  msg.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="content">
      <div class="role">${roleName}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    </div>
  `;
  chatInner.appendChild(msg);
  scrollToBottom();
  return msg;
}

function addToolCall(container, data) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  const statusClass = data.ok ? 'ok' : 'err';
  const statusText = data.ok ? '成功' : '失败';
  const argsStr = JSON.stringify(data.arguments, null, 2);
  card.innerHTML = `
    <div class="tool-card-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="tool-icon">🔧</span>
      <span class="tool-name">${data.name}</span>
      <span class="tool-status ${statusClass}">${statusText}</span>
      <span class="tool-chevron">▶</span>
    </div>
    <div class="tool-card-body">
      <div class="args">参数: ${escapeHtml(argsStr)}</div>
      <div class="result">结果: ${escapeHtml(data.result || '')}</div>
    </div>
  `;
  container.appendChild(card);
  scrollToBottom();
}

function scrollToBottom() {
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== 启动 =====
init();
</script>
</body>
</html>
